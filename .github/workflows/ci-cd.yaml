name: TinyMe CI/CD Pipeline (Upgraded)
# Generated by Hermes + TinyMe
# Security-hardened pipeline for FastAPI + PostgreSQL + Redis + Docker + Kubernetes

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: "3.11"

jobs:
  # Stage 1: Lint
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install ruff
      - name: Run ruff
        run: ruff check .

  # Stage 2: Secrets Scan
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  # Stage 3: SAST Scan
  sast-scan:
    name: SAST Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install bandit semgrep
      - name: Run bandit
        run: bandit -r . -f json -o bandit-report.json || true
      - name: Run semgrep
        run: semgrep --config=auto --json -o semgrep-report.json || true
      - name: Upload SAST reports
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: |
            bandit-report.json
            semgrep-report.json

  # Stage 4: Test
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint, secrets-scan, sast-scan]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -r requirements.txt pytest safety
      - name: Run safety check
        run: safety check --json --output safety-report.json || true
      - name: Run tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb
          REDIS_URL: redis://localhost:6379/0
        run: pytest --cov=. --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # Stage 5: Build
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build package
        run: |
          pip install build
          python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Stage 6: SBOM Generation
  sbom-generate:
    name: SBOM Generation
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install cyclonedx
        run: pip install cyclonedx-bom
      - name: Generate SBOM
        run: cyclonedx-py requirements -o sbom.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  # Stage 7: Docker Build
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [sbom-generate]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Stage 8: Container Signing
  container-sign:
    name: Container Sign
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign image
        run: |
          cosign sign --yes ${{ env.IMAGE_NAME }}:${{ github.sha }}

  # Stage 9: Vulnerability Scan
  vulnerability-scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: "sarif"
          output: "trivy-results.sarif"
      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"

  # Stage 10: Policy Check
  policy-check:
    name: Policy Check
    runs-on: ubuntu-latest
    needs: [vulnerability-scan]
    steps:
      - uses: actions/checkout@v4
      - name: Install conftest
        run: |
          wget https://github.com/open-policy-agent/conftest/releases/download/v0.46.0/conftest_0.46.0_Linux_x86_64.tar.gz
          tar xzf conftest_0.46.0_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin/
      - name: Run conftest
        run: conftest test --policy policies/ Dockerfile

  # Stage 11: Deploy Staging
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: [policy-check, container-sign]
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging
        run: |
          echo "Deploying to staging..."
          # helm upgrade --install tinyme ./helm-chart \
          #   --namespace staging \
          #   --set image.tag=${{ github.sha }}

  # Stage 12: Smoke Test
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    steps:
      - name: Run smoke tests
        run: |
          echo "Running smoke tests against staging..."
          # curl -f https://staging.tinyme.dev/health || exit 1

  # Stage 13: Approval Gate
  approval-gate:
    name: Approval Gate
    runs-on: ubuntu-latest
    needs: [smoke-test]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Wait for approval
        run: echo "Waiting for manual approval..."

  # Stage 14: Deploy Production
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [approval-gate]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          # helm upgrade --install tinyme ./helm-chart \
          #   --namespace production \
          #   --set image.tag=${{ github.sha }}

  # Stage 15: Health Check
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [deploy-production]
    steps:
      - name: Verify deployment
        run: |
          echo "Running health checks..."
          # curl -f https://tinyme.dev/health || exit 1

  # Stage 16: Rollback Ready
  rollback-ready:
    name: Rollback Ready
    runs-on: ubuntu-latest
    needs: [health-check]
    if: failure()
    steps:
      - name: Rollback
        run: |
          echo "Rolling back deployment..."
          # helm rollback tinyme 0 --namespace production
