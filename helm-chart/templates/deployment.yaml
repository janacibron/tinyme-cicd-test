apiVersion: apps/v1
kind: Deployment
metadata:
  name: REPLACEME
  labels:
    app.kubernetes.io/name: tinyme
    app.kubernetes.io/managed-by: helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tinyme
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tinyme
    spec:
      containers:
        - name: tinyme
          image: ghcr.io/janacibron/tinyme:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: tinyme
  labels:
    app.kubernetes.io/name: tinyme
    app.kubernetes.io/managed-by: helm
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
  selector:
    app.kubernetes.io/name: tinyme
